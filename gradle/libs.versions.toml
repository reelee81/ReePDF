[versions]
agp = "9.5.2"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
itextpdf = "9.8.1"
desugar = "2.1.5"
window = "1.5.1"
recyclerview = "1.4.0"
fragment = "1.9.1"
autofill = "1.3.0"
mupdf = "1.28.6-reepdf3"
coroutines = "1.11.0"
kotlin = "2.4.21"
composeMultiplatform = "1.12.2"
lifecycle = "2.11.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
itextpdf-kernel = { group = "com.itextpdf.android", name = "kernel-android", version.ref = "itextpdf" }
itextpdf-layout = { group = "com.itextpdf.android", name = "layout-android", version.ref = "itextpdf" }
itextpdf-forms = { group = "com.itextpdf.android", name = "forms-android", version.ref = "itextpdf" }
itextpdf-bc-adapter  = { group = "com.itextpdf.android", name = "bouncy-castle-adapter-android", version.ref = "itextpdf" }
itextpdf-bc-connector = { group = "com.itextpdf.android", name = "bouncy-castle-connector-android", version.ref = "itextpdf" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
mupdf-fitz = { group = "hu.reelee81.reepdf", name = "mupdf-fitz", version.ref = "mupdf" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
